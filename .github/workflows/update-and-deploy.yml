name: Update rainfall products and publish Pages

on:
  workflow_dispatch:
  schedule:
    # Run every day after the main global forecast cycles are available.
    - cron: "15 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system libraries for Cartopy and ecCodes
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libgeos-dev libproj-dev proj-data

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Generate fresh 24-hour and 10-day products
        run: python hadramout_mme_precip.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Refresh web pages from the new report
        run: |
          python update_index.py
          python make_preview_html.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: outputs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
